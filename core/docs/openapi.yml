openapi: 3.0.3
info:
  title: Lab Works Tracker Service
  version: "1.0.0"

servers:
  - url: http://localhost:8080

tags:
  - name: Auth
  - name: Groups
  - name: LabWorks
  - name: Assignments
  - name: Submissions
  - name: Grades

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - INVALID_REQUEST
                - UNAUTHORIZED
                - FORBIDDEN
                - NOT_FOUND
                - USER_NOT_FOUND
                - GROUP_NOT_FOUND
                - LAB_WORK_NOT_FOUND
                - ASSIGNMENT_NOT_FOUND
                - SUBMISSION_NOT_FOUND
                - ALREADY_SUBMITTED
                - DEADLINE_PASSED
                - INTERNAL_ERROR
            message:
              type: string

    Token:
      type: object
      required: [token]
      properties:
        token:
          type: string

    Group:
      type: object
      required: [id, name, course]
      properties:
        id:
          type: integer
        name:
          type: string
        course:
          type: integer

    LabWork:
      type: object
      required: [id, title, description, goal, equipment, reagents, procedure, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        goal:
          type: string
        equipment:
          type: string
        reagents:
          type: string
        procedure:
          type: string
        filePath:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    LabWorkInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
        description:
          type: string
        goal:
          type: string
        equipment:
          type: string
        reagents:
          type: string
        procedure:
          type: string
        filePath:
          type: string
          nullable: true

    LabWorkListResponse:
      type: object
      required: [items, total, page, limit, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LabWork'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer

    Assignment:
      type: object
      properties:
        id:
          type: integer
        labWorkId:
          type: integer
        groupId:
          type: integer
        deadline:
          type: string
          format: date-time

    Submission:
      type: object
      required: [id, assignmentId, studentId, status]
      properties:
        id:
          type: integer
        assignmentId:
          type: integer
        studentId:
          type: string
          format: uuid
        textReport:
          type: string
        filePath:
          type: string
          nullable: true
        status:
          type: string
        submittedAt:
          type: string
          format: date-time

    StudentAssignment:
      type: object
      required: [assignmentId, labWorkId, title, description, assignmentStatus]
      properties:
        assignmentId:
          type: integer
        labWorkId:
          type: integer
        title:
          type: string
        description:
          type: string
        deadline:
          type: string
          format: date-time
          nullable: true
        assignmentStatus:
          type: string
        submissionId:
          type: integer
          nullable: true
        submissionStatus:
          type: string
          nullable: true
        textReport:
          type: string
          nullable: true
        filePath:
          type: string
          nullable: true
        submittedAt:
          type: string
          format: date-time
          nullable: true
        grade:
          type: integer
          nullable: true
        teacherComment:
          type: string
          nullable: true

    TeacherSubmission:
      type: object
      required: [submissionId, assignmentId, studentId, studentName, groupName, labWorkTitle, textReport, status]
      properties:
        submissionId:
          type: integer
        assignmentId:
          type: integer
        studentId:
          type: string
          format: uuid
        studentName:
          type: string
        groupName:
          type: string
        labWorkTitle:
          type: string
        textReport:
          type: string
        filePath:
          type: string
          nullable: true
        status:
          type: string
        submittedAt:
          type: string
          format: date-time
          nullable: true
        grade:
          type: integer
          nullable: true
        teacherComment:
          type: string
          nullable: true

    Grade:
      type: object
      properties:
        id:
          type: integer
        submissionId:
          type: integer
        grade:
          type: integer

paths:
  /api/v1/auth/register:
    post:
      tags: [Auth]
      security: []
      summary: Регистрация студента
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, fullName, groupId]
              properties:
                username:
                  type: string
                password:
                  type: string
                fullName:
                  type: string
                groupId:
                  type: integer
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'

        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '409':
          description: Username already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '404':
          description: Group not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                
  /api/v1/auth/login:
    post:
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '400':
          description: Invalid request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          description: Internal error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/groups/create:
    post:
      tags: [Groups]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, course]
              properties:
                name:
                  type: string
                course:
                  type: integer
      responses:
        '201': { description: Created }
        '400':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Conflict (group exists)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/groups/list:
    get:
      tags: [Groups]
      security: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  groups:
                    type: array
                    items:
                      $ref: '#/components/schemas/Group'
        '401':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/labworks:
    get:
      tags: [LabWorks]
      security: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
            minimum: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 20
        - in: query
          name: search
          schema:
            type: string
      responses:
        '200':
          description: List of lab works
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabWorkListResponse'
        '400':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

    post:
      tags: [LabWorks]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabWorkInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabWork'
        '400':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/labworks/{id}:
    get:
      tags: [LabWorks]
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Lab work details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabWork'
        '400':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/student/assignments:
    get:
      tags: [Assignments]
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Student assignments
          content:
            application/json:
              schema:
                type: object
                properties:
                  assignments:
                    type: array
                    items:
                      $ref: '#/components/schemas/StudentAssignment'
        '401':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/teacher/submissions:
    get:
      tags: [Submissions]
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Teacher submissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  submissions:
                    type: array
                    items:
                      $ref: '#/components/schemas/TeacherSubmission'
        '401':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

    put:
      tags: [LabWorks]
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabWorkInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabWork'
        '400':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

    delete:
      tags: [LabWorks]
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '204':
          description: Deleted
        '400':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/assignments/create:
    post:
      tags: [Assignments]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [labWorkId, groupId, deadline]
              properties:
                labWorkId:
                  type: integer
                groupId:
                  type: integer
                deadline:
                  type: string
                  format: date-time
      responses:
        '201': {}
        '400':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: LabWork or Group not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/submissions/create:
    post:
      tags: [Submissions]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignmentId]
              properties:
                assignmentId:
                  type: integer
                textReport:
                  type: string
                filePath:
                  type: string
                  nullable: true
      responses:
        '201': {}
        '400':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Assignment not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Already submitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: Deadline passed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/grades/set:
    post:
      tags: [Grades]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [submissionId, grade]
              properties:
                submissionId:
                  type: integer
                grade:
                  type: integer
                comment:
                  type: string
      responses:
        '200': {}
        '400':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Submission not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
